[workspace]
resolver = "2"
members = ["wayfarer-package", "wayfarer-costing", "wayfarer", "wayfarer-service", "wayfarer-sar", "wayfarer-ffi", "wayfarer-compiler", "wayfarer-cli", "wayfarer-road-graph", "wayfarer-line-network", "wayfarer-layer", "wayfarer-terrain", "wayfarer-terrain-compiler"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Limina-Agency/wayfarer"
rust-version = "1.95"

[workspace.dependencies]
# Test-only: the reference the package codec is checked against (unmaintained,
# frozen at 1.3.3; see wayfarer_package::codec).
bincode = "=1.3.3"
blake3 = "1.8"
# Date parts of OSM conditional restrictions only: no clock, no time zones.
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = { version = "1.1", features = ["zlib-rs"] }
geo = { version = "0.33.1", default-features = false }
# Pure-Rust (musl-derived) math: the same bits on every target, unlike the
# platform C library behind `f64::sin` and friends. See
# `wayfarer_package::math`.
libm = "0.2.16"
# The allocator of the `wayfarer` binary and the C library; its options
# (`mi_option_set`) to purge freed pages at once in a compile.
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
mimalloc = { version = "0.1", default-features = false }
# OSM PBF passes, published from its own repository (Limina-Agency/osm-pbf-ingest).
osm-pbf-ingest = "0.5.0"
petgraph = "0.8"
rayon = "1.10"
roaring = "0.11"
rstar = "0.13"
# JSON Schema of the request and result types (the `schema` features).
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
wayfarer = { path = "wayfarer", version = "0.6.0" }
wayfarer-compiler = { path = "wayfarer-compiler", version = "0.6.0" }
wayfarer-costing = { path = "wayfarer-costing", version = "0.6.0" }
wayfarer-line-network = { path = "wayfarer-line-network", version = "0.6.0" }
wayfarer-package = { path = "wayfarer-package", version = "0.6.0" }
wayfarer-road-graph = { path = "wayfarer-road-graph", version = "0.6.0" }
wayfarer-service = { path = "wayfarer-service", version = "0.6.0" }
wayfarer-sar = { path = "wayfarer-sar", version = "0.6.0" }
wayfarer-layer = { path = "wayfarer-layer", version = "0.6.0" }
wayfarer-terrain = { path = "wayfarer-terrain", version = "0.6.0" }
wayfarer-terrain-compiler = { path = "wayfarer-terrain-compiler", version = "0.6.0" }
zstd = "0.14"

[workspace.lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Search, correlation, guidance and graph-building helpers thread many plain
# inputs (graph, costing, options, scratch buffers) through deliberately flat
# function signatures; bundling them into structs is not a style this
# codebase uses.
too_many_arguments = "allow"

# Packages are hashed on every check; unoptimized BLAKE3 makes debug builds
# and tests crawl.
[profile.dev.package.blake3]
opt-level = 3

# The terrain compile's tests compile regions of a few hundred thousand posts (64 samples
# each); optimized, they take seconds instead of minutes. Overflow checks stay on.
[profile.dev.package.wayfarer-terrain-compiler]
opt-level = 3

# Release builds (the published `wayfarer` binaries and C libraries, and the
# gates' timings) optimize the whole program at once: fat LTO with one codegen
# unit inlines across crates, where the engine's hot paths call into
# `wayfarer-package` and `wayfarer-costing`. Random Małopolskie drives take
# 4 % fewer instructions and 12 % less time (16 % and 12 % with the C
# library's mimalloc); a release build of the binary and the C library takes
# about twice as long.
[profile.release]
lto = "fat"
codegen-units = 1
