[package]
name = "wayfarer-ffi"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "C ABI for the offline routing engine: open routing packages; route (waypoints, closures), matrix, isochrone, map matching, snap and navigation progress requests as JSON, with cancellation"
readme = "README.md"
keywords = ["routing", "ffi", "c-api", "openstreetmap", "navigation"]
categories = ["science::geo", "development-tools::ffi"]
exclude = ["tests/abi.rs", "tests/compile.rs", "tests/sar.rs", "tests/schema.rs"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
wayfarer.workspace = true
wayfarer-costing.workspace = true
wayfarer-package.workspace = true
wayfarer-service.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
wayfarer-compiler = { workspace = true, optional = true }
wayfarer-sar = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
libmimalloc-sys = { workspace = true, optional = true }

[features]
default = ["mimalloc"]
# The library's global allocator: mimalloc instead of the platform's malloc,
# for the engine's many small, short-lived allocations. It needs a C compiler
# for the target. A Rust program
# that links this crate gets the allocator too; turn off default features to
# keep its own.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# The wayfarer_compile_* calls: compile packages on the device. A
# separate build of the library, since it adds the compiler and OSM ingest.
compiler = ["dep:wayfarer-compiler"]
# The wayfarer_sar_* calls: search and rescue planning (reach prediction,
# team plans, track coverage) on an open package.
sar = ["dep:wayfarer-sar"]
# The compiler's phase events and counting allocator for benchmark harnesses
# (see wayfarer-compiler), in place of mimalloc: a program has one global
# allocator, so this also turns the library's mimalloc off.
benchmark-profiling = ["compiler", "wayfarer-compiler/benchmark-profiling"]

[dev-dependencies]
# Generates the JSON Schemas in `schema/` (tests/schema.rs).
wayfarer-service = { workspace = true, features = ["schema"] }
wayfarer-compiler = { workspace = true, features = ["schema"] }
wayfarer-sar = { workspace = true, features = ["schema"] }
schemars = { workspace = true }
tempfile = "3"
