[package]
name = "wayfarer-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for hostile packages, C ABI request JSON and overlay sets (cargo fuzz)"

[package.metadata]
cargo-fuzz = true

[dependencies]
blake3 = "1.8"
libfuzzer-sys = "0.4"
serde_json = "1.0"
tempfile = "3"
wayfarer = { path = "../wayfarer" }
wayfarer-compiler = { path = "../wayfarer-compiler" }
# Without mimalloc: the sanitizers and libFuzzer's malloc hooks must see every
# allocation.
wayfarer-ffi = { path = "../wayfarer-ffi", default-features = false }
wayfarer-package = { path = "../wayfarer-package" }
wayfarer-road-graph = { path = "../wayfarer-road-graph" }
wayfarer-service = { path = "../wayfarer-service" }

# Its own workspace: built with nightly by cargo fuzz, never with the main one.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "package"
path = "fuzz_targets/package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_table"
path = "fuzz_targets/package_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "leg_attrs"
path = "fuzz_targets/leg_attrs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "overlay_set"
path = "fuzz_targets/overlay_set.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route_parity"
path = "fuzz_targets/route_parity.rs"
test = false
doc = false
bench = false
