[package]
name = "wayfarer-service"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Routing sources, readiness and route workflows over the offline routing engine"
readme = "README.md"
keywords = ["routing", "openstreetmap", "navigation", "offline", "cache"]
categories = ["science::geo", "caching"]
# Builds its test package with the compiler, a workspace-only dev-dependency.
exclude = ["tests/overlays_and_sar.rs"]

[lints]
workspace = true

[dependencies]
schemars = { workspace = true, optional = true }
blake3 = { workspace = true }
wayfarer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# JSON Schema derives for the request and result types (`schemars`).
schema = ["dep:schemars", "wayfarer/schema"]

[dev-dependencies]
wayfarer-road-graph = { workspace = true, features = ["snapshot"] }
# Builds the test packages. Path only (no version), so publishing drops it and
# this crate needs no compiler on crates.io.
wayfarer-compiler = { path = "../wayfarer-compiler" }
tempfile = "3"
