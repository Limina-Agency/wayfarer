# Third-party notices for release archives (`cargo about generate about.hbs`).
# The release workflow generates one file per archive from the crates that
# archive's binary links; RELEASING.md step 6.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
