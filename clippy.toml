# Package bytes must be the same on every platform, and the platform's C math
# library rounds these differently (glibc, musl, Apple, Bionic, MSVC): code that
# feeds a package uses `wayfarer_package::math` instead. `powi` is
# listed because LLVM expands it differently in debug and release builds. The
# engine's query-time code (wayfarer) allows them.
disallowed-methods = [
  { path = "f64::sin", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::cos", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::tan", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::sin_cos", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::asin", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::acos", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::atan", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::atan2", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::sinh", reason = "platform libm" },
  { path = "f64::cosh", reason = "platform libm" },
  { path = "f64::tanh", reason = "platform libm" },
  { path = "f64::exp", reason = "platform libm" },
  { path = "f64::exp2", reason = "platform libm" },
  { path = "f64::exp_m1", reason = "platform libm" },
  { path = "f64::ln", reason = "platform libm; use wayfarer_package::math" },
  { path = "f64::ln_1p", reason = "platform libm" },
  { path = "f64::log", reason = "platform libm" },
  { path = "f64::log2", reason = "platform libm" },
  { path = "f64::log10", reason = "platform libm" },
  { path = "f64::powf", reason = "platform libm" },
  { path = "f64::powi", reason = "rounding depends on the build; multiply instead" },
  { path = "f64::cbrt", reason = "platform libm" },
  { path = "f64::hypot", reason = "platform libm; use (x * x + y * y).sqrt()" },
  { path = "f32::sin", reason = "platform libm" },
  { path = "f32::cos", reason = "platform libm" },
  { path = "f32::tan", reason = "platform libm" },
  { path = "f32::asin", reason = "platform libm" },
  { path = "f32::atan2", reason = "platform libm" },
  { path = "f32::exp", reason = "platform libm" },
  { path = "f32::ln", reason = "platform libm" },
  { path = "f32::powf", reason = "platform libm" },
  { path = "f32::powi", reason = "rounding depends on the build; multiply instead" },
  { path = "f32::hypot", reason = "platform libm" },
]
