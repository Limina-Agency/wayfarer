name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # scripts/check.sh: the same checks run locally on Linux or macOS.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  deny:
    # RustSec advisories, licenses (deny.toml, in step with about.toml),
    # banned crates and sources.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check-macos:
    # scripts/check.sh on Apple silicon (its Darwin branch links the C
    # examples with CoreFoundation): tests, the Monaco package byte for byte,
    # the C ABI examples and the Kraków centre gate.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: scripts/check.sh

  msrv:
    # The oldest Rust the crates claim (`rust-version` in Cargo.toml) must
    # still build them; CI and releases build with the newer toolchain
    # rust-toolchain.toml pins.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the rust-version toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "MSRV=$msrv" >>"$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo "+$MSRV" check --workspace --all-targets --locked
      - run: cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  check-windows:
    # The workspace tests, the C library's compile calls and the Monaco
    # package on Windows: packages must be the same bytes there.
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo test --workspace
      - run: cargo test -p wayfarer-ffi --features compiler --test compile
      - run: cargo build --release -p wayfarer-cli
      - name: Monaco package matches fixtures/monaco-info.json
        run: |
          wayfarer=target/release/wayfarer.exe
          "$wayfarer" compile fixtures/monaco.osm.pbf -o "$RUNNER_TEMP/monaco.mrt" \
            --country MC --graph-id monaco >/dev/null
          "$wayfarer" verify "$RUNNER_TEMP/monaco.mrt" >/dev/null
          # Normalised as scripts/check.sh does, compared in Python so the
          # line endings Windows prints don't matter.
          "$wayfarer" info "$RUNNER_TEMP/monaco.mrt" | python -c '
          import json, sys
          info = json.dumps(json.load(sys.stdin.buffer), indent=2, sort_keys=True, ensure_ascii=False) + "\n"
          with open("fixtures/monaco-info.json", encoding="utf-8", newline="") as f:
              expected = f.read().replace("\r\n", "\n")
          if info != expected:
              sys.stdout.reconfigure(newline="\n")
              print(info, end="")
              sys.exit("error: the Monaco package differs from fixtures/monaco-info.json")
          '
          "$wayfarer" route "$RUNNER_TEMP/monaco.mrt" --from 43.7397,7.4275 \
            --to 43.7290,7.4160 >/dev/null

  i686:
    # A 32-bit target: packages are the same bytes on every platform, and a
    # 32-bit engine must open them (usize is 32 bits there).
    runs-on: ubuntu-24.04
    env:
      TARGET: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners fetch from Ubuntu's mirrors, which sometimes
      # answer 503 for a few minutes: retry rather than fail the job.
      - name: Install gcc-multilib
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update &&
              sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends gcc-multilib &&
              exit 0
            echo "apt failed (attempt $attempt); retrying in 60 s"
            sleep 60
          done
          exit 1
      - run: rustup toolchain install && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: i686
      - run: cargo test -p wayfarer-package -p wayfarer -p wayfarer-layer -p wayfarer-terrain -p wayfarer-terrain-compiler --target "$TARGET"
      - run: cargo build --release -p wayfarer-cli --target "$TARGET"
      - name: Monaco package matches fixtures/monaco-info.json
        run: |
          wayfarer="target/$TARGET/release/wayfarer"
          "$wayfarer" compile fixtures/monaco.osm.pbf -o "$RUNNER_TEMP/monaco.mrt" \
            --country MC --graph-id monaco >/dev/null
          "$wayfarer" verify "$RUNNER_TEMP/monaco.mrt" >/dev/null
          "$wayfarer" info "$RUNNER_TEMP/monaco.mrt" | python3 -c '
          import json, sys
          print(json.dumps(json.load(sys.stdin), indent=2, sort_keys=True, ensure_ascii=False))
          ' >"$RUNNER_TEMP/info.json"
          diff -u fixtures/monaco-info.json "$RUNNER_TEMP/info.json"
          "$wayfarer" route "$RUNNER_TEMP/monaco.mrt" --from 43.7397,7.4275 \
            --to 43.7290,7.4160 >/dev/null
