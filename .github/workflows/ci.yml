name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux only; scripts/check.sh runs the same checks locally on Linux or
    # macOS.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  deny:
    # RustSec advisories, licenses (deny.toml, in step with about.toml),
    # banned crates and sources.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
